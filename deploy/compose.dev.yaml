name: bablo-dev

services:
  bablo:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      BABLO_ENV: development
      BABLO_HTTP_ADDR: :8080
      BABLO_LOG_LEVEL: info
      BABLO_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      BABLO_REDIS_URL: redis://redis:6379/0
      BABLO_TRUSTED_PROXY_CIDRS: ${BABLO_TRUSTED_PROXY_CIDRS:-}
      BABLO_WEB_ORIGIN: ${BABLO_WEB_ORIGIN:-http://localhost:5173}
      BABLO_AUTH_ENCRYPTION_KEY: ${BABLO_AUTH_ENCRYPTION_KEY:-}
      BABLO_AUTH_KEY_VERSION: ${BABLO_AUTH_KEY_VERSION:-v1}
      BABLO_AUTH_SESSION_TTL: ${BABLO_AUTH_SESSION_TTL:-12h}
      BABLO_AUTH_REQUIRE_ADMIN_MFA: ${BABLO_AUTH_REQUIRE_ADMIN_MFA:-true}
      BABLO_AUTH_TOTP_ISSUER: ${BABLO_AUTH_TOTP_ISSUER:-Bablo}
      BABLO_CREDENTIAL_ENCRYPTION_KEY: ${BABLO_CREDENTIAL_ENCRYPTION_KEY:-}
      BABLO_CREDENTIAL_ENCRYPTION_KEYS: ${BABLO_CREDENTIAL_ENCRYPTION_KEYS:-}
      BABLO_CREDENTIAL_KEY_VERSION: ${BABLO_CREDENTIAL_KEY_VERSION:-v1}
      BABLO_PAYMENT_ORDER_TTL: ${BABLO_PAYMENT_ORDER_TTL:-1h}
      BABLO_PAYMENT_EXPIRATION_INTERVAL: ${BABLO_PAYMENT_EXPIRATION_INTERVAL:-1m}
      BABLO_PAYMENT_WEBHOOK_TOLERANCE: ${BABLO_PAYMENT_WEBHOOK_TOLERANCE:-5m}
      BABLO_PAYMENT_STRIPE_ENABLED: ${BABLO_PAYMENT_STRIPE_ENABLED:-false}
      BABLO_PAYMENT_ALLOW_TEST_PROVIDERS: ${BABLO_PAYMENT_ALLOW_TEST_PROVIDERS:-false}
      BABLO_PAYMENT_STRIPE_SECRET_KEY: ${BABLO_PAYMENT_STRIPE_SECRET_KEY:-}
      BABLO_PAYMENT_STRIPE_WEBHOOK_SECRET: ${BABLO_PAYMENT_STRIPE_WEBHOOK_SECRET:-}
      BABLO_PAYMENT_STRIPE_ACCOUNT_ID: ${BABLO_PAYMENT_STRIPE_ACCOUNT_ID:-}
      BABLO_PAYMENT_STRIPE_SUCCESS_URL: ${BABLO_PAYMENT_STRIPE_SUCCESS_URL:-http://localhost:5173/billing/success}
      BABLO_PAYMENT_STRIPE_CANCEL_URL: ${BABLO_PAYMENT_STRIPE_CANCEL_URL:-http://localhost:5173/billing}
      BABLO_PAYMENT_VOUCHER_ENABLED: ${BABLO_PAYMENT_VOUCHER_ENABLED:-false}
      BABLO_PAYMENT_VOUCHER_ENCRYPTION_KEY: ${BABLO_PAYMENT_VOUCHER_ENCRYPTION_KEY:-}
      BABLO_PAYMENT_VOUCHER_ENCRYPTION_KEYS: ${BABLO_PAYMENT_VOUCHER_ENCRYPTION_KEYS:-}
      BABLO_PAYMENT_VOUCHER_KEY_VERSION: ${BABLO_PAYMENT_VOUCHER_KEY_VERSION:-v1}
      BABLO_PAYMENT_FIXTURE_ENABLED: ${BABLO_PAYMENT_FIXTURE_ENABLED:-false}
      BABLO_PAYMENT_FIXTURE_MERCHANT_ID: ${BABLO_PAYMENT_FIXTURE_MERCHANT_ID:-}
      BABLO_PAYMENT_FIXTURE_SECRET: ${BABLO_PAYMENT_FIXTURE_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - bablo

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bablo

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - bablo

networks:
  bablo:
    internal: true
