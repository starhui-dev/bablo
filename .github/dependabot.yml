version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - cpa
    groups:
      cpa-v7-patch:
        patterns:
          - "github.com/router-for-me/CLIProxyAPI/v7"
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "github.com/router-for-me/CLIProxyAPI/v8*"
